<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Word Race</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Andika:wght@700&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#9FD7F5;--disp:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;--ar:'Noto Sans Arabic','Geeza Pro',Tahoma,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#9FD7F5}}
:root[data-theme="dark"]{--bg:#9FD7F5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--disp);color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible{outline:4px solid #FDE047;outline-offset:3px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
/* HUD like the original: wooden labels */
#hud[hidden]{display:none}
.wood{position:fixed;background:linear-gradient(#7A4A2A,#5B3520);border:3px solid #3B2314;border-radius:10px;padding:4px 14px;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:3}
#lvl{top:max(10px,env(safe-area-inset-top));left:70px}
#time{top:max(10px,env(safe-area-inset-top));left:180px}
#pts{top:max(10px,env(safe-area-inset-top));right:14px;background:linear-gradient(#FDE68A,#F59E0B);color:#7C2D12;border-color:#B45309}
#pts::before{content:'🪙 '}
#pos{position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom));background:#22B8CF;border:3px solid #0B7285;border-radius:10px 4px 10px 4px;padding:4px 18px;font-size:30px;z-index:3;transform:skew(-8deg)}
#gate{position:fixed;left:130px;bottom:max(20px,env(safe-area-inset-bottom));font-size:22px;z-index:3;text-shadow:0 2px 0 #000}
#q{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:200px;height:150px;background:#fff;border:6px solid #2563EB;border-radius:18px;z-index:4;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#q[hidden]{display:none}
#q img{max-width:88%;max-height:88%;object-fit:contain}
#q .spk{font-size:80px}
.qs{position:absolute;right:-18px;bottom:-18px;width:52px;height:52px;border-radius:50%;background:#2563EB;border:4px solid #fff;font-size:22px}
.arrow{position:fixed;bottom:max(70px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.28);border:5px solid rgba(255,255,255,.85);font-size:56px;z-index:3;display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.arrow:active{background:rgba(255,255,255,.55)}
#left{left:24px}#right{right:24px}
#count{position:fixed;inset:0;display:grid;place-items:center;font-size:160px;z-index:6;text-shadow:0 8px 0 rgba(0,0,0,.35);pointer-events:none}
#count[hidden]{display:none}
#flash{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0}
#flash.ok{background:radial-gradient(transparent 50%,rgba(34,197,94,.7))}#flash.bad{background:radial-gradient(transparent 50%,rgba(239,68,68,.7))}
#flash.on{animation:fl .7s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:70px;z-index:5;opacity:0;pointer-events:none;font-family:'Andika',var(--disp);-webkit-text-stroke:3px #0F172A;paint-order:stroke fill}
#pop.ok{color:#4ADE80}#pop.bad{color:#FCA5A5}
#pop.on{animation:pp 1.3s}
@keyframes pp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD54A,#FF8A00);border:4px solid #fff;z-index:7;font-size:20px}
/* menus */
#menu{position:fixed;inset:0;z-index:8;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:linear-gradient(rgba(76,29,149,.82),rgba(30,27,75,.92))}
#menu[hidden]{display:none}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.l1{font-size:clamp(70px,12vw,140px);color:#FDE047;-webkit-text-stroke:5px #92400E;paint-order:stroke fill}
.l2{font-size:clamp(30px,5vw,56px);color:#fff;-webkit-text-stroke:4px #1E1B4B;paint-order:stroke fill}
.coins{font-size:26px;background:rgba(0,0,0,.3);padding:4px 16px;border-radius:999px}
.how{font-size:18px;color:#E0E7FF;text-align:center;max-width:820px;margin:0}
.grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;color:#1F2A44;border-radius:16px;padding:8px 14px;min-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;border:4px solid transparent;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.tile b{font-size:21px;font-weight:400}.tile .lt{font-family:'Andika',var(--disp);font-size:21px}.tile .ar{font-size:14px;color:#475569}
.tile[aria-pressed="true"]{border-color:#FDE047;background:#FFFBEB}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{background:linear-gradient(#FDE047,#F59E0B);color:#7C2D12;border:4px solid #fff;border-radius:16px;padding:10px 22px;font-size:22px;box-shadow:0 5px 0 #B45309}
.btn.big{font-size:36px;padding:12px 44px}
.btn.blue{background:linear-gradient(#60A5FA,#2563EB);color:#fff;box-shadow:0 5px 0 #1E3A8A}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.btn:active{transform:translateY(3px)}
.modal{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:14px;background:rgba(15,23,42,.6);overflow:auto}
.card{width:min(560px,94vw);background:linear-gradient(160deg,#4C1D95,#1E1B4B);border:5px solid #FDE047;border-radius:24px;padding:20px;text-align:center}
.card.wide{width:min(900px,96vw)}
.card h2{font-size:44px;margin:0;color:#FDE047}.card h3{font-size:24px;margin:14px 0 8px}
.podium{font-size:90px;line-height:1}
.big{font-size:24px;margin:8px 0;font-family:system-ui;font-weight:700}.big small{font-weight:400;font-size:15px;color:#C7D2FE}
.unl{font-size:19px;font-family:system-ui;background:rgba(253,224,71,.15);border-radius:12px;padding:10px}
.small{font-family:system-ui;font-size:16px;color:#C7D2FE}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.gcard{background:#fff;color:#1F2A44;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:3px;border:4px solid transparent}
.gcard .sw{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:36px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gcard b{font-size:20px;font-weight:400}.gcard .ar{font-size:14px;color:#475569}.gcard .spd{font-size:14px;color:#2563EB;font-family:system-ui}
.gcard .st{font-size:16px;color:#16A34A}
.gcard.sel{border-color:#22C55E}
.gcard.locked{filter:grayscale(.6);opacity:.85}.gcard.locked .st{color:#B45309}
.gcard[aria-disabled="true"]{opacity:.55}
@media (prefers-reduced-motion: reduce){#pop.on,#flash.on{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<button class="back" data-act="menu" aria-label="Menu">◀</button>
<div id="hud" hidden>
  <div class="wood" id="lvl">Unit 1</div><div class="wood" id="time">00:00</div><div class="wood" id="pts">0</div>
  <div id="pos">4th</div><div id="gate">GATE 1/10</div>
  <button class="arrow" id="left" aria-label="Left">◀</button><button class="arrow" id="right" aria-label="Right">▶</button>
</div>
<div id="q" hidden></div>
<div id="count" hidden></div>
<div id="flash"></div><div id="pop"></div>
<div id="menu" hidden></div>
<script src="three.min.js"></script>
<script>var IMG = {};</script>
<script>'use strict';
// ================= CONTENT =================
const UNITS = [
  { id: 1, c: '#E4572E', L: { a: [[1, 'apple'], [3, 'avocado'], [2, 'astronaut']], c: [[4, 'cat'], [6, 'cactus'], [5, 'coffee']], t: [[10, 'table'], [9, 'TV'], [42, 'tin']], n: [[8, 'nose'], [7, 'nectarine']] }, words: ['cat', 'can', 'tan', 'nan', 'tat', 'an'] },
  { id: 2, c: '#138A80', L: { p: [[15, 'panda'], [13, 'pencil'], [14, 'popcorn']], i: [[18, 'igloo'], [17, 'Israel']], r: [[23, 'robot'], [24, 'radio'], [22, 'run']], s: [[19, 'sun'], [20, 'sandwich'], [21, 'sandals']] }, words: ['rat', 'pin', 'sat', 'tin', 'cap', 'sip'] },
  { id: 3, c: '#7B4FB3', L: { d: [[29, 'dog'], [31, 'dolphin'], [30, 'domino']], g: [[32, 'goat'], [33, 'guitar'], [34, 'gorilla']], h: [[37, 'house'], [35, 'hippo'], [36, 'hamburger']], o: [[38, 'orange'], [39, 'overalls']] }, words: ['dog', 'sad', 'pot', 'cop', 'hot', 'top'] },
  { id: 4, c: '#D97706', L: { b: [[51, 'banana'], [52, 'bed'], [53, 'balloons']], e: [[49, 'elephant'], [50, 'Eskimo']], f: [[55, 'fish'], [56, 'frog'], [54, 'flamingo']], m: [[57, 'mouse'], [58, 'mango'], [59, 'milkshake']] }, words: ['bed', 'pen', 'net', 'fan', 'hen', 'ten'] },
  { id: 5, c: '#2F6FDB', L: { j: [[84, 'jam'], [83, 'jeans'], [85, 'jester']], k: [[87, 'kite'], [88, 'kangaroo'], [86, 'ketchup']], l: [[94, 'lemon'], [93, 'London'], [92, 'love']], y: [[91, 'yoyo'], [89, 'yacht'], [90, 'yard']] }, words: ['jam', 'jet', 'log', 'jar', 'yak', 'jog'] },
];
const MODES = [['pic', 'First letter', 'الحرف الأول'], ['letter', 'Hear the letter', 'استمع للحرف'], ['word', 'Hear the word', 'استمع للكلمة']];
const VEHICLES = [
  { id: 0, name: 'Quad', ar: 'دراجة رباعية', cost: 0, speed: 21, body: 0xF59E0B, helmet: 0xFACC15, kind: 'atv' },
  { id: 1, name: 'Sport Quad', ar: 'رباعية رياضية', cost: 600, speed: 24, body: 0x22C55E, helmet: 0x16A34A, kind: 'sport' },
  { id: 2, name: 'Dune Buggy', ar: 'سيارة رملية', cost: 1500, speed: 27, body: 0xEF4444, helmet: 0xFFFFFF, kind: 'buggy' },
  { id: 3, name: 'Monster Truck', ar: 'شاحنة عملاقة', cost: 3000, speed: 30, body: 0x8B5CF6, helmet: 0x111827, kind: 'monster' },
];
const TRACKS = [
  { id: 0, name: 'Forest', ar: 'الغابة', cost: 0, sky: 0x9FD7F5, fog: 0xBFE3F5, ground: 0x5FAF3C, road: 0x8B5A3C, edge: 0x6E4630, tree: [0x2F8F3A, 0x3FA34D, 0x7CB518, 0xE0A526], rock: 0xB3542D },
  { id: 1, name: 'Desert', ar: 'الصحراء', cost: 1000, sky: 0xFAD7A0, fog: 0xF7E1BC, ground: 0xE9C27A, road: 0xC2884B, edge: 0xA8703A, tree: [0x4D9A3A, 0x6BAF3F], rock: 0xC9622B, cactus: true },
  { id: 2, name: 'Snow', ar: 'الثلج', cost: 2500, sky: 0xCFE6FA, fog: 0xE6F1FB, ground: 0xF1F5F9, road: 0x8C7B70, edge: 0x6B5E55, tree: [0x1F6B4A, 0x2E7D5B], rock: 0x94A3B8, snow: true },
];
const GATES = 10, GAP = 165, FIRST = 150, LANES = [-4.2, 0, 4.2], HALF = 7.2;

// ================= UTIL =================
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LS = { get(k, d) { try { const v = localStorage.getItem('lrace:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('lrace:' + k, JSON.stringify(v)); } catch (e) {} } };
const ord = n => n + (['th', 'st', 'nd', 'rd'][n] || 'th');

// ================= SOUND =================
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Google US|Aaron|Nicky/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t, rate = .8) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; if (VOICE) u.voice = VOICE; u.rate = rate; speechSynthesis.speak(u); } catch (e) {} }
let AC = null, ENG = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(fs, type = 'sine', vol = .14, gap = .1, len = .18) { const a = ac(); if (!a) return; fs.forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; const t = a.currentTime + i * gap; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + len + .02); }); }
const sfx = { good: () => tone([660, 880, 1175], 'triangle', .15, .08, .2), bad: () => tone([260, 190], 'sawtooth', .07, .14, .25), beep: () => tone([660], 'square', .06, 0, .15), go: () => tone([1046], 'square', .07, 0, .4), win: () => tone([523, 659, 784, 1046, 1319], 'triangle', .14, .11, .25) };
function engineStart() { const a = ac(); if (!a || ENG) return; const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain(); o.type = 'sawtooth'; o.frequency.value = 50; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = .025; o.connect(f); f.connect(g); g.connect(a.destination); o.start(); ENG = { o, g }; }
function engineStop() { if (ENG) { try { ENG.o.stop(); } catch (e) {} ENG = null; } }

// ================= STATE =================
const S = { unit: LS.get('unit', 1), mode: LS.get('mode', 'pic'), veh: LS.get('veh', 0), track: LS.get('track', 0), coins: LS.get('coins', 0), owned: LS.get('owned', [0]), tracks: LS.get('tracks', [0]),
  running: false, s: 0, off: 0, lane: 1, speed: 0, boost: 0, slow: 0, gate: 0, correct: 0, earned: 0, t: 0, q: null, gates: [], opp: [], finished: false };
const U = () => UNITS.find(u => u.id === S.unit);
const V = () => VEHICLES[S.veh];
const T = () => TRACKS[S.track];

// ================= TRACK MATH =================
const cx = s => 16 * Math.sin(s / 95) + 6 * Math.sin(s / 41);
const dcx = s => 16 / 95 * Math.cos(s / 95) + 6 / 41 * Math.cos(s / 41);
function frame(s) { const a = dcx(s), n = Math.hypot(a, 1); return { p: new THREE.Vector3(cx(s), 0, -s), fwd: new THREE.Vector3(a / n, 0, -1 / n), right: new THREE.Vector3(1 / n, 0, a / n) }; }
function at(s, off, y = 0) { const f = frame(s); return f.p.clone().addScaledVector(f.right, off).setY(y); }

// ================= THREE SCENE =================
let renderer, scene, camera, world, player, clock;
function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(62, 1, .5, 900);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, .85); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, .75); sun.position.set(30, 60, 20); scene.add(sun);
  clock = new THREE.Clock();
  resize(); window.addEventListener('resize', resize);
}
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 1 ? 75 : 62; camera.updateProjectionMatrix(); }
const LEN = FIRST + GAP * (GATES - 1) + 160;
function lam(c) { return new THREE.MeshLambertMaterial({ color: c, flatShading: true }); }
function buildWorld() {
  if (world) scene.remove(world);
  world = new THREE.Group(); scene.add(world);
  const tr = T();
  scene.background = new THREE.Color(tr.sky); scene.fog = new THREE.Fog(tr.fog, 120, 420);
  // ground
  const g = new THREE.Mesh(new THREE.PlaneGeometry(1400, LEN + 900), lam(tr.ground)); g.rotation.x = -Math.PI / 2; g.position.set(0, -.05, -LEN / 2); world.add(g);
  // road strip + edges
  const mk = (w0, w1, y, col) => {
    const pos = [], idx = []; let k = 0;
    for (let s = -60; s <= LEN + 260; s += 2) { const f = frame(s); const a = f.p.clone().addScaledVector(f.right, w0), b = f.p.clone().addScaledVector(f.right, w1); pos.push(a.x, y, a.z, b.x, y, b.z); if (k) idx.push(2 * k - 2, 2 * k - 1, 2 * k, 2 * k - 1, 2 * k + 1, 2 * k); k++; }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: col, side: THREE.DoubleSide })); world.add(m);
  };
  mk(-HALF - 1.2, HALF + 1.2, .01, tr.edge); mk(-HALF, HALF, .03, tr.road);
  // tyre tracks
  [-2.1, 2.1].forEach(o => mk(o - .25, o + .25, .04, new THREE.Color(tr.road).multiplyScalar(.85).getHex()));
  // fences (instanced posts + rails)
  const nPost = Math.floor((LEN + 200) / 7) * 2;
  const posts = new THREE.InstancedMesh(new THREE.BoxGeometry(.25, 1.3, .25), lam(0x8D6E63), nPost), rails = new THREE.InstancedMesh(new THREE.BoxGeometry(.12, .14, 7.1), lam(0xA1887F), nPost * 2);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(1, 1, 1); let pi = 0, ri = 0;
  for (let s = -20; s < LEN + 180; s += 7) [-1, 1].forEach(side => {
    const p = at(s, side * (HALF + 1.9), .65); m4.compose(p, q.identity(), sc); posts.setMatrixAt(pi++, m4);
    const f = frame(s + 3.5), mid = at(s + 3.5, side * (HALF + 1.9), 0); q.setFromUnitVectors(new THREE.Vector3(0, 0, -1), f.fwd);
    [.45, .95].forEach(y => { if (ri < nPost * 2) { mid.y = y; m4.compose(mid, q, sc); rails.setMatrixAt(ri++, m4); } });
  });
  posts.count = pi; rails.count = ri; world.add(posts, rails);
  // trees
  const nT = 520, cone = new THREE.ConeGeometry(2.2, 5.5, 6), trunk = new THREE.CylinderGeometry(.35, .45, 1.6, 6);
  const leaves = tr.tree.map(c => new THREE.InstancedMesh(cone, lam(c), nT)), trunks = new THREE.InstancedMesh(trunk, lam(0x6D4C41), nT * tr.tree.length);
  const cnt = tr.tree.map(() => 0); let tk = 0;
  for (let i = 0; i < nT * 1.6; i++) {
    const s = Math.random() * (LEN + 300) - 40, side = Math.random() < .5 ? -1 : 1, d = HALF + 5 + Math.pow(Math.random(), 1.6) * 90, ci = rnd(tr.tree.length);
    if (cnt[ci] >= nT) continue;
    const p = at(s, side * d, 0), k = .7 + Math.random() * .9;
    if (tr.cactus && Math.random() < .5) { const cm = new THREE.Mesh(new THREE.CylinderGeometry(.45 * k, .5 * k, 4 * k, 7), lam(0x3F8F3A)); cm.position.copy(p).setY(2 * k); world.add(cm); continue; }
    m4.compose(p.clone().setY(3.4 * k + .8 * k), q.identity(), new THREE.Vector3(k, k, k)); leaves[ci].setMatrixAt(cnt[ci]++, m4);
    m4.compose(p.clone().setY(.8 * k), q, new THREE.Vector3(k, k, k)); trunks.setMatrixAt(tk++, m4);
    if (tr.snow) { /* snow caps drawn via lighter top cone */ }
  }
  leaves.forEach((l, i) => { l.count = cnt[i]; world.add(l); }); trunks.count = tk; world.add(trunks);
  // rocks
  const rocks = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1.6, 0), lam(tr.rock), 140);
  for (let i = 0; i < 140; i++) { const s = Math.random() * (LEN + 300), side = Math.random() < .5 ? -1 : 1, k = .5 + Math.random() * 1.8; m4.compose(at(s, side * (HALF + 3.5 + Math.random() * 30), k * .6), new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random(), Math.random(), Math.random())), new THREE.Vector3(k, k * .8, k)); rocks.setMatrixAt(i, m4); }
  world.add(rocks);
  // mountains

// Kalima adapter: feeds a teacher's word set into a game. Loaded after the game code.
// Modes: img = picture -> word, mean = meaning -> word, listen = hear the word -> word.
const KPLAY = (() => { for (const st of [sessionStorage, localStorage]) { try { const v = st.getItem('kl:play'); if (v) return JSON.parse(v); } catch (e) {} } return null; })();
const KSET = (KPLAY && KPLAY.set) || { title: 'Kalima', termLang: 'en', meanLang: 'ar', words: [] };
const KW = (() => { const seen = new Set(); return (KSET.words || []).filter(w => w.term && w.term.trim() && w.meaning && w.meaning.trim())
  .filter(w => { const k = w.term.trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); })();
const KUI = (() => { try { return JSON.parse(localStorage.getItem('kl:ui')) || 'ar'; } catch (e) { return 'ar'; } })();
const KT = {
  ar: { img: 'صورة ← كلمة', mean: 'معنى ← كلمة', listen: 'اسمع ← كلمة', back: '← رجوع إلى Kalima', few: 'أضف كلمتين على الأقل مع المعنى.',
    bus: 'اضغط على الحافلة التي عليها الكلمة الصحيحة. الحافلة تتحرك باتجاه السهم فقط.', kicks: 'انظر إلى الشاشة الكبيرة، ثم صوّب الكرة نحو الكلمة الصحيحة.', race: 'وجّه المركبة بالأسهم ◀ ▶ نحو البوابة التي عليها الكلمة الصحيحة.' },
  he: { img: 'תמונה ← מילה', mean: 'פירוש ← מילה', listen: 'שמיעה ← מילה', back: '← חזרה ל-Kalima', few: 'הוסיפו לפחות שתי מילים עם פירוש.',
    bus: 'לחצו על האוטובוס עם המילה הנכונה. האוטובוס נוסע רק בכיוון החץ.', kicks: 'הסתכלו על המסך הגדול ובעטו אל המילה הנכונה.', race: 'כוונו את הרכב עם החצים ◀ ▶ אל השער עם המילה הנכונה.' },
  en: { img: 'Picture → word', mean: 'Meaning → word', listen: 'Listen → word', back: '← Back to Kalima', few: 'Add at least two words with meanings.',
    bus: 'Tap the bus with the right word. Buses only move the way the arrow points.', kicks: 'Look at the big screen, then shoot at the right word.', race: 'Steer with ◀ ▶ through the gate with the right word.' }
}[KUI] || null;
const KTX = KT || { img: 'Picture → word', mean: 'Meaning → word', listen: 'Listen → word', back: '← Kalima', few: '', bus: '', kicks: '', race: '' };
const KLANG = { en: 'en-US', ar: 'ar-SA', he: 'he-IL', fr: 'fr-FR', es: 'es-ES', de: 'de-DE', ru: 'ru-RU', tr: 'tr-TR' };
const KHAS_IMG = KW.filter(w => w.img).length >= 2;
let KMODE = (() => { try { return localStorage.getItem('kl:gmode'); } catch (e) { return null; } })();
if (!['img', 'mean', 'listen'].includes(KMODE) || (KMODE === 'img' && !KHAS_IMG)) KMODE = KHAS_IMG ? 'img' : 'mean';

// ---------- voice in the right language ----------
let kAudio = null;
function kVoice(code) { try { const vs = speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(code.slice(0, 2)));
  return vs.find(v => /(Enhanced|Premium|Natural|Neural|Online)/i.test(v.name)) || vs[0] || null; } catch (e) { return null; } }
function kTTS(text, lang) { try { speechSynthesis.cancel(); if (kAudio) { kAudio.pause(); kAudio = null; } if (!text) return;
  const code = KLANG[lang] || 'en-US', u = new SpeechSynthesisUtterance(text); u.lang = code; const v = kVoice(code); if (v) u.voice = v; u.rate = .85; speechSynthesis.speak(u); } catch (e) {} }
function kSayWord(w) { if (w.audio) { try { speechSynthesis.cancel(); if (kAudio) kAudio.pause(); kAudio = new Audio(w.audio); kAudio.play().catch(() => {}); return; } catch (e) {} } kTTS(w.term, KSET.termLang); }
// The games call say() with English phrases ("cat starts with ...", "The answer is CAT"); only the set's own words are spoken.
say = function (t) {
  t = String(t || '').trim(); if (!t) { try { speechSynthesis.cancel(); } catch (e) {} return; }
  const m = KW.find(w => w.meaning.trim() === t); if (m) return kTTS(m.meaning, KSET.meanLang);
  const low = t.toLowerCase();
  const w = KW.slice().sort((a, b) => b.term.length - a.term.length).find(x => { const k = x.term.trim().toLowerCase(); return low === k || low.endsWith(' ' + k) || low.endsWith(' ' + k + '.'); });
  if (w) return kSayWord(w);
};

// ---------- text fitting (words or whole sentences) ----------
const KFACE = (s, w = 700) => `${w} ${s}px Andika,"IBM Plex Sans Arabic","IBM Plex Sans Hebrew","Century Gothic",Arial,sans-serif`;
const kM = document.createElement('canvas').getContext('2d');
const kRTL = l => l === 'ar' || l === 'he';
function kWrapM(x, text, W) { const ws = String(text).trim().split(/\s+/), lines = []; let cur = '';
  for (const w of ws) { const t2 = cur ? cur + ' ' + w : w; if (!cur || x.measureText(t2).width <= W) cur = t2; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur); return lines; }
// biggest font size whose wrapped lines fit inside W x H
function kFit(text, W, H, maxFs, minFs, x = kM) {
  for (let fs = maxFs; fs >= minFs; fs -= 1) { x.font = KFACE(fs); const lines = kWrapM(x, text, W);
    if (lines.length * fs * 1.18 <= H && lines.every(l => x.measureText(l).width <= W)) return { fs, lines }; }
  x.font = KFACE(minFs); return { fs: minFs, lines: kWrapM(x, text, W) };
}
function kTextWidth(line, fs) { kM.font = KFACE(fs); return kM.measureText(line).width; }
// SVG multi-line text centred on (0, cy)
function kSvgText(g, lines, fs, cy, fill, lang) {
  const lh = fs * 1.18, top = cy - (lines.length * lh) / 2;
  lines.forEach((ln, i) => { const t = el('text', { x: 0, y: (top + lh * i + fs * .9).toFixed(1), 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 700, fill, 'font-family': 'Andika, "IBM Plex Sans Arabic", "IBM Plex Sans Hebrew", "Century Gothic", sans-serif' }, g);
    if (kRTL(lang)) t.setAttribute('direction', 'rtl'); t.textContent = ln; });
}
// meaning cards drawn as pictures, so every game shows them where it shows images
let KCARD = [360, 270];
function kCard(text, lang) {
  const [W, H] = KCARD, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
  try { x.direction = kRTL(lang) ? 'rtl' : 'ltr'; } catch (e) {}
  const pad = W * .07, f = kFit(text, W - pad * 2, H - pad * 1.6, Math.round(H * .34), 14, x), lh = f.fs * 1.18, top = (H - f.lines.length * lh) / 2;
  x.font = KFACE(f.fs); x.textAlign = 'center'; x.textBaseline = 'middle';
  f.lines.forEach((ln, i) => { const w = Math.min(W - pad, x.measureText(ln).width + 16), y = top + lh * i + lh / 2;
    x.fillStyle = '#FFE680'; x.fillRect((W - w) / 2, y + f.fs * .08, w, f.fs * .36); x.fillStyle = '#1F2A44'; x.fillText(ln, W / 2, y); });
  return c.toDataURL('image/png');
}
// bus badge: a pill that grows to two or three lines for long words and sentences
function kBadge(g, label, stroke) {
  const len = [...label].length;
  let f = len <= 10 ? { fs: len <= 1 ? 33 : 27, lines: [label] } : kFit(label, 150, 66, 22, 12);
  if (len <= 10 && kTextWidth(label, f.fs) > 150) f = kFit(label, 150, 66, 22, 12);
  const bw = Math.max(44, Math.max(...f.lines.map(l => kTextWidth(l, f.fs))) + 26), bh = Math.max(42, f.lines.length * f.fs * 1.18 + 12);
  el('rect', { x: -bw / 2, y: -bh / 2, width: bw, height: bh, rx: Math.min(21, bh / 2), fill: '#fff', stroke, 'stroke-width': 4 }, g);
  kSvgText(g, f.lines, f.fs, 0, '#1F2A44', KSET.termLang);
}
const kShuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function kBuild(n) {
  const pool = KMODE === 'img' ? KW.filter(w => w.img) : KW;
  const ws = kShuffle(pool).slice(0, Math.max(2, Math.min(n, pool.length)));
  const L = {};
  ws.forEach((w, i) => { const key = 'k' + i; IMG[key] = KMODE === 'img' ? w.img : kCard(w.meaning, KSET.meanLang); L[w.term.trim()] = [[key, KMODE === 'mean' ? w.meaning.trim() : '']]; });
  UNITS[0].L = L; UNITS[0].words = ws.map(w => w.term.trim());
  S.mode = KMODE === 'listen' ? 'word' : 'pic';
}
UNITS.length = 0;
UNITS.push({ id: 1, c: '#0E7C86', flag: ['#0E7C86', '#FFFFFF', '#0E7C86'], L: {}, words: [] });
S.unit = 1;
kBuild(4);

// ---------- shared menu pieces ----------
function kModes(btnClass) {
  return [KHAS_IMG ? 'img' : null, 'mean', 'listen'].filter(Boolean)
    .map(k => `<button class="${btnClass}" aria-pressed="${KMODE === k}" data-act="kmode" data-id="${k}"><b>${KTX[k]}</b></button>`).join('');
}
function kTitle() { return String(KSET.title || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const kBack = `<a class="kback" href="index.html#games">${KTX.back}</a>`;
const kFew = KW.length < 2 ? `<p class="ar how" style="color:#B91C1C">${KTX.few}</p>` : '';
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act="kmode"]'); if (!t) return;
  KMODE = t.getAttribute('data-id'); try { localStorage.setItem('kl:gmode', KMODE); } catch (er) {} kBuild(4); showMenu();
}, true);
const kStyle = document.createElement('style');
kStyle.textContent = `.kback{display:inline-block;margin-top:10px;color:#fff;background:rgba(0,0,0,.35);padding:8px 16px;border-radius:999px;text-decoration:none;font:600 15px system-ui,sans-serif}
.ktitle{font:800 22px "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);margin:2px 0 6px}`;
document.head.appendChild(kStyle);

;
KCARD = [440, 200]; kBuild(8);
(() => { const st = document.createElement('style'); st.textContent = '#q{width:min(340px,70vw)!important}'; document.head.appendChild(st); })();
const _kStartRace = startRace; startRace = function () { kBuild(8); _kStartRace(); };
// gate signs: one big word, or a sentence wrapped over up to four lines
textTex = function (text, border) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 384; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 512, 384); x.lineWidth = 32; x.strokeStyle = border; x.strokeRect(16, 16, 480, 352);
  try { x.direction = kRTL(KSET.termLang) ? 'rtl' : 'ltr'; } catch (e) {}
  const f = kFit(text, 420, 290, [...text].length <= 3 ? 230 : 150, 34, x), lh = f.fs * 1.18, top = (384 - f.lines.length * lh) / 2;
  x.fillStyle = '#1F2A44'; x.font = KFACE(f.fs); x.textAlign = 'center'; x.textBaseline = 'middle';
  f.lines.forEach((ln, i) => x.fillText(ln, 256, top + lh * i + lh / 2 + 6));
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 4; return tx;
};
showMenu = function () {
  S.running = false; engineStop(); closeModal(); $('#hud').hidden = true;
  $('#menu').innerHTML = `<div class="logo"><span class="l1">WORD</span><span class="l2">RACE</span></div><div class="ktitle">${kTitle()}</div><div class="coins">🪙 ${S.coins}</div>
    <p class="ar how">${KTX.race}</p>${kFew}<div class="grid">${kModes('tile')}</div>
    <div class="row"><button class="btn blue" data-act="garage">🏍 Garage · ${V().name}</button><button class="btn blue" data-act="garage">🗺 Track · ${T().name}</button></div>
    ${KW.length >= 2 ? '<button class="btn big" data-act="race">RACE ▶</button>' : ''}${kBack}`;
  $('#menu').hidden = false;
};
showMenu();
</script>
</body>
</html>
