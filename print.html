<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalima Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: a three-step print shop. One task per screen; step 3 is a live A4 preview with a short settings rail. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#18222E; --muted:#5B6878; --line:#DCE3EA;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --mark:#FFD84D; --mark-soft:#FFF1B8; --bad:#D6453D;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161D;--surface:#18212B;--ink:#E8EEF4;--muted:#9AA8B8;--line:#2A3542;--accent:#3BB8C2;--accent-ink:#06262A;--mark:#E8B923;--mark-soft:#3B3313;--bad:#FF6B61;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161D;--surface:#18212B;--ink:#E8EEF4;--muted:#9AA8B8;--line:#2A3542;--accent:#3BB8C2;--accent-ink:#06262A;--mark:#E8B923;--mark-soft:#3B3313;--bad:#FF6B61;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;text-decoration:none;color:var(--ink)}
.brand span{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 90%,transparent 90%);padding:0 4px}
.sp{flex:1}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-size:13px}
.step.on{border-color:var(--accent);color:var(--ink)}
.step.on b{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:13px 24px;font-size:17px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
textarea.in{min-height:110px;resize:vertical}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
/* step 1 */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:26px 64px minmax(0,1fr) 40px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.item .n{color:var(--muted);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.thumb{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;padding:0;font-size:22px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.item input{border:1px solid transparent;background:var(--bg);border-radius:8px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
.item input:focus{border-color:var(--accent)}
.ico{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:38px;height:38px;display:grid;place-items:center;padding:0}
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
/* step 2 */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.type{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:start}
.type:hover{border-color:var(--muted)}
.type.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.type b{font-size:17px}
.mini{background:#fff;border:1px solid #E3E8EE;border-radius:10px;height:120px;display:grid;gap:6px;padding:8px}
.mini .c{border:1.5px dashed #B9C3CF;border-radius:6px;display:grid;place-items:center;font:700 13px Andika,Arial,sans-serif;color:#1F2A44;overflow:hidden}
.mini img{max-width:70%;max-height:46px;object-fit:contain}
/* step 3 */
.design{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.design{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media (max-width:860px){.rail{position:static}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 12px;font-weight:600;min-width:42px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.colors button.on{box-shadow:0 0 0 3px var(--ink)}
.check{display:flex;gap:8px;align-items:center}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.dl{display:flex;flex-direction:column;gap:8px}
.note{background:var(--mark-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
.pgwrap{width:100%;max-width:640px}
.pglabel{font-size:12px;color:var(--muted);margin-bottom:4px}
.pgbox{width:100%;aspect-ratio:210/297;position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.12);border-radius:4px;background:#fff}
/* A4 page drawn in mm, scaled to fit */
.page{position:absolute;top:0;left:0;width:210mm;height:297mm;background:#fff;color:#1F2A44;transform-origin:0 0;padding:10mm;display:flex;flex-direction:column}
.grid{flex:1;display:grid;min-height:0}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;overflow:hidden;position:relative;padding:3mm;min-height:0}
.card .corner{position:absolute;top:1.5mm;inset-inline-start:2.5mm;font:9pt Arial,sans-serif;color:#8792A2}
.card img{max-width:88%;object-fit:contain;min-height:0}
.card .t{text-align:center;line-height:1.15;font-weight:700;overflow-wrap:anywhere}
.boxes,.choices{display:flex;gap:2mm;justify-content:center;flex-wrap:wrap}
.boxes span{border:.5mm solid #1F2A44;border-radius:1.5mm}
.choices span{border:.5mm solid #1F2A44;border-radius:50%;display:grid;place-items:center;font-weight:700}
.school{height:7mm;display:flex;align-items:flex-end;justify-content:center;font:10pt Arial,sans-serif;color:#5B6878}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:20;display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--mark)}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.picgrid button{border:2px solid var(--line);background:#fff;border-radius:12px;aspect-ratio:1;padding:6px}
.picgrid button:hover{border-color:var(--accent)}
.picgrid img{width:100%;height:100%;object-fit:contain}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--mark-soft)}
.pro{display:inline-block;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;margin-inline-start:4px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30;font-weight:600;max-width:90vw;text-align:center}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  .top,.rail,.foot,.pglabel,.noprint,#modal{display:none!important}
  .wrap{max-width:none}
  .design{display:block}
  .pages{gap:0}
  .pgwrap{max-width:none;width:210mm}
  .pgbox{aspect-ratio:auto;width:210mm;height:297mm;box-shadow:none;border-radius:0;break-after:page;overflow:hidden}
  .page{transform:none!important}
}
</style>
</head>

const scriptOf = s => /[؀-ۿ]/.test(s) ? 'ar' : /[֐-׿]/.test(s) ? 'he' : 'en';
const isRTL = s => scriptOf(s) !== 'en';
function mainLang() { const c = { en: 0, ar: 0, he: 0 }; P.items.forEach(i => i.text.trim() && c[scriptOf(i.text)]++); return Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]; }

const TYPES = [

  { id: 'letter', name: 'حرف وصورة', desc: 'الحرف الأول كبيراً، ومعه الصورة والكلمة.', per: [1, 2, 4, 6] },
  { id: 'clip', name: 'مشبك الصوت', desc: 'صورة و3 حروف. الطالب يضع مشبكاً على الحرف الأول الصحيح.', per: [4, 6, 8], back: true },
  { id: 'write', name: 'اكتب الكلمة', desc: 'صورة ومربعات بعدد الحروف ليكتب الطالب الكلمة.', per: [2, 4, 6, 8] },
  { id: 'seq', name: 'تسلسل الأحداث', desc: 'مشاهد القصة مخلوطة، والرقم الصحيح على الخلف.', per: [2, 4, 6], back: true }

const GRID = { 1: [1, 1], 2: [1, 2], 4: [2, 2], 6: [2, 3], 8: [2, 4], 12: [3, 4] };
const ALPHA = { en: 'abcdefghijklmnoprstuvwy', ar: 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي', he: 'אבגדהוזחטיכלמנסעפצקרשת' };
// stable pseudo-random from a string, so the preview and the Word file match
function rng(seed) { let h = 2166136261; for (const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
const sshuffle = (a, seed) => { const r = rng(seed); a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const firstLetter = s => { s = s.trim(); return [...s][0] || ''; };
const letters = s => [...s.trim()].filter(c => /\p{L}/u.test(c));

// A card is plain data: { img, parts: [{k:'text'|'big'|'boxes'|'choices'|'num', ...}] }. Both renderers read it.
function buildCards() {
  const items = P.items.filter(i => i.text.trim() || i.img), fronts = [], backs = [];
  const want = (img, txt) => ({ img: P.show === 'word' ? '' : img, txt: P.show === 'pic' && img ? '' : txt });
  if (P.type === 'flash') items.forEach(i => { const w = want(i.img, i.text.trim()); fronts.push({ img: w.img, parts: w.txt ? [{ k: 'text', v: w.txt }] : [] }); });
  if (P.type === 'match') items.forEach(i => { if (i.img) fronts.push({ img: i.img, parts: [] }); fronts.push({ img: '', parts: [{ k: 'text', v: i.text.trim() }] }); });
  if (P.type === 'letter') items.forEach(i => { const f = firstLetter(i.text), en = scriptOf(f) === 'en';
    fronts.push({ img: i.img, parts: [{ k: 'big', v: en ? f.toUpperCase() + f.toLowerCase() : f }, { k: 'text', v: i.text.trim(), small: true }] }); });
  if (P.type === 'clip') items.forEach(i => { const f = firstLetter(i.text).toLowerCase(), lang = scriptOf(f), r = rng(i.text);
    const pool = [...ALPHA[lang]].filter(c => c !== f); const d = []; while (d.length < 2 && pool.length) d.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
    const ch = sshuffle([f, ...d], i.text + 'c');
    fronts.push({ img: i.img, parts: [{ k: 'choices', v: ch }], text: i.text }); backs.push({ img: '', parts: [{ k: 'answer', v: f, pos: ch.indexOf(f), n: 3 }] }); });
  if (P.type === 'write') items.forEach(i => { const ls = letters(i.text);
    fronts.push({ img: i.img, parts: ls.length <= 12 && !/\s/.test(i.text.trim()) ? [{ k: 'boxes', n: ls.length }] : [{ k: 'lines', n: Math.min(2, Math.ceil(ls.length / 22)) }] }); });
  if (P.type === 'seq') { const order = items.map((i, n) => ({ i, n: n + 1 })), sh = sshuffle(order, P.title + items.length);
    sh.forEach(o => { fronts.push({ img: o.i.img, parts: o.i.text.trim() ? [{ k: 'text', v: o.i.text.trim(), sentence: true }] : [] }); backs.push({ img: '', parts: [{ k: 'num', v: o.n }] }); }); }
  return { fronts, backs: (T().back && P.back) ? backs : null };
}
// pages: front page, then (optionally) its mirrored back page, for double-sided printing (flip on the long edge)
function buildPages() {
  const { fronts, backs } = buildCards(), per = P.per, [cols] = GRID[per], pages = [];
  for (let s = 0; s < fronts.length; s += per) {
    pages.push({ kind: 'front', cards: fronts.slice(s, s + per) });
    if (backs) { const b = backs.slice(s, s + per), out = []; for (let r = 0; r < per / cols; r++) { const row = b.slice(r * cols, r * cols + cols); while (row.length < cols) row.push(null); out.push(...row.reverse()); } pages.push({ kind: 'back', cards: out }); }
  }
  return pages;
}
// type sizes in pt for one card, from the card's height
function sizes() {
  const [cols, rows] = GRID[P.per], hmm = (277 - (P.school ? 8 : 0)) / rows, wmm = 190 / cols, base = Math.min(hmm * 1.0, wmm * .62) * P.size;
  return { hmm, wmm, word: Math.max(12, Math.min(110, base * .55)), big: Math.max(20, Math.min(220, base * 1.0)), small: Math.max(9, base * .22), choice: Math.max(16, Math.min(60, base * .45)) };
}
const textPt = (txt, sz, sentence) => { const n = [...txt].length; if (sentence || n > 14) return Math.max(11, Math.min(sz.word * .78, sz.word * 14 / Math.max(n, 14) * 2)); return n > 8 ? sz.word * 8 / n * 1.1 : sz.word; };

// ================= HTML preview =================
function cardHTML(c, sz, back) {
  if (!c) return '<div class="card"></div>';
  const font = cssFont(curFont()), hasText = c.parts.length > 0;
  const imgH = hasText ? sz.hmm * (P.type === 'letter' ? .38 : c.parts[0]?.k === 'choices' ? .5 : .55) : sz.hmm * .78;
  let h = '';
  if (P.corner && P.title && !back) h += `<span class="corner" dir="auto">${esc(P.title)}</span>`;
  if (c.img) h += `<img src="${esc(c.img)}" alt="" style="max-height:${imgH.toFixed(1)}mm" onerror="this.remove()">`;
  c.parts.forEach(p => {
    if (p.k === 'text') { const pt = p.small ? sz.small * 1.6 : textPt(p.v, sz, p.sentence); h += `<div class="t" dir="auto" style="font-family:${font};font-size:${pt.toFixed(1)}pt">${esc(p.v)}</div>`; }
    if (p.k === 'big') h += `<div class="t" dir="auto" style="font-family:${font};font-size:${sz.big.toFixed(1)}pt;line-height:1">${esc(p.v)}</div>`;

    }
    sections.push({ properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 567, bottom: 400, left: 567, right: 567, footer: 250 } } },
      footers: P.school ? { default: new Footer({ children: [para([run(P.school, 10, { bold: false, color: '5B6878' })], { rtl: isRTL(P.school) })] }) } : undefined,
      children: [new Table({ layout: TableLayoutType.FIXED, columnWidths: Array(cols).fill(colW), width: { size: colW * cols, type: WidthType.DXA }, rows: trs })] });
  }
  return Packer.toBlob(new Document({ creator: 'Kalima', title: P.title || 'Cards', sections }));
}
async function downloadWord(btn) {
  btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = '⏳ جاري التجهيز…';
  try { const blob = await makeDocx(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (P.title || 'cards').replace(/[\\/:*?"<>|]+/g, ' ').trim() + ' - ' + T().name + '.docx';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('تم تنزيل ملف Word'); }
  catch (e) { console.error(e); toast('تعذر إنشاء ملف Word'); }
  btn.disabled = false; btn.innerHTML = old;
}

// ================= events =================
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a, v = el.dataset.v, id = el.dataset.id;
  if (a === 'mback') { if (e.target === el) closeModal(); return; }
  switch (a) {
    case 'go': if (+v > 1 && !P.items.some(i => i.text.trim() || i.img)) { toast('أضف كلمة واحدة على الأقل'); return; } P.step = +v; render(); scrollTo(0, 0); break;
    case 'addRow': P.items.push({ id: uid(), text: '', img: '' }); save(); render(); { const ins = document.querySelectorAll('.item input'); ins[ins.length - 1].focus(); } break;
    case 'del': P.items = P.items.filter(i => i.id !== id); save(); render(); break;
    case 'clear': P.items = [{ id: uid(), text: '', img: '' }]; P.title = ''; save(); render(); break;
    case 'addList': { const ls = $('#pList').value.split('\n').map(x => x.replace(/\t.*$/, '').trim()).filter(Boolean); P.items = P.items.filter(i => i.text.trim() || i.img).concat(ls.map(x => ({ id: uid(), text: x, img: '' }))); save(); render(); toast('أضيف ' + ls.length); break; }
    case 'import': { const [src, sid] = $('#pImport').value.split(/:(.+)/); const s = src === 'sets' ? store.get('sets', []).find(x => x.id === sid) : store.get('lib', []).find(x => x.libId === sid);
      if (s) { P.title = s.title || ''; P.items = s.words.map(w => ({ id: uid(), text: w.term, img: w.img || '' })); save(); render(); toast('تم الاستيراد'); } break; }
    case 'type': P.type = v; if (!T().per.includes(P.per)) P.per = T().per.includes(4) ? 4 : T().per[0]; save(); render(); break;
    case 'per': P.per = +v; save(); render(); break;
    case 'show': P.show = v; save(); render(); break;
    case 'size': P.size = +v; save(); render(); break;
    case 'color': P.color = v; save(); render(); break;
    case 'word': downloadWord(el); break;
    case 'pdf': window.print(); break;
    case 'pic': openPic(id); break;
    case 'mclose': closeModal(); break;
    case 'mtab': M.tab = v; renderModal(); break;
    case 'libGo': M.q = $('#mq').value; M.ql = $('#mql').value; libSearch(); break;
    case 'pickUrl': P.items.find(i => i.id === M.id).img = v; save(); closeModal(); render(); break;
    case 'picDel': P.items.find(i => i.id === M.id).img = ''; save(); closeModal(); render(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.a === 'txt') { const it = P.items.find(i => i.id === el.dataset.id); if (it) { it.text = el.value; save(); } }
  if (el.id === 'pTitle') { P.title = el.value; save(); }
  if (el.id === 'pSchool') { P.school = el.value; store.set('school', el.value.trim()); save(); clearTimeout(window._st); window._st = setTimeout(render, 400); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'pFont') { if (el.value === '__other') { const f = (window.prompt ? prompt('اسم الخط كما يظهر في Word:') : '') || ''; if (f.trim()) P.font = f.trim(); } else P.font = el.value; save(); render(); }
  if (el.id === 'pCut') { P.cut = el.checked; save(); render(); }
  if (el.id === 'pCorner') { P.corner = el.checked; save(); render(); }
  if (el.id === 'pBack') { P.back = el.checked; save(); render(); }
  if (el.id === 'upImg') setImgFile(el.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.a === 'txt') { e.preventDefault(); document.querySelector('[data-a=addRow]').click(); }
});
document.addEventListener('paste', e => { if (!M.id) return; const f = [...(e.clipboardData?.files || [])].find(x => /^image\//.test(x.type)); if (f) { e.preventDefault(); setImgFile(f); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); setImgFile(e.dataTransfer.files[0]); } });
render();
</script>
