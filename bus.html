<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Word Bus</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Andika:wght@700&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#A3A9B4;--ink:#1F2A44;--yel:#FFC21A;--org:#FF8A00;--grn:#7ED321;--grn2:#4FA80E;--pur:#5B0FB0;
  --disp:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;--ar:'Noto Sans Arabic','Geeza Pro',Tahoma,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#A3A9B4}}
:root[data-theme="dark"]{--bg:#A3A9B4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--disp);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.car{cursor:pointer}
/* corner buttons */
.corner{position:fixed;top:max(8px,env(safe-area-inset-top));z-index:5;display:flex;gap:8px}
.corner.l{left:10px}.corner.r{right:10px}
.cbtn{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD54A,#FF8A00);border:4px solid #fff;box-shadow:0 4px 0 #B45309,0 6px 10px rgba(0,0,0,.3);font-size:26px;display:grid;place-items:center;color:#fff}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #B45309}
.cbtn.blue{background:radial-gradient(circle at 35% 30%,#7DD3FC,#2563EB);box-shadow:0 4px 0 #1E3A8A,0 6px 10px rgba(0,0,0,.3)}
/* menu */
#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;
  background:linear-gradient(180deg,rgba(91,15,176,.92),rgba(60,8,120,.95));overflow:auto}
#menu[hidden]{display:none}
.logo{text-align:center;line-height:.95;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.l1{font-size:clamp(54px,9vw,104px);color:var(--yel);-webkit-text-stroke:5px #7A3B00;paint-order:stroke fill;letter-spacing:2px}
.l2{font-size:clamp(30px,5vw,54px);color:#fff;-webkit-text-stroke:4px #3B2A5A;paint-order:stroke fill;letter-spacing:3px}
.how{color:#EDE7FF;font-size:19px;margin:2px 0 4px;text-align:center}
.units,.modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ubtn,.mbtn{background:#fff;border-radius:18px;padding:10px 16px;min-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.25);border:4px solid transparent}
.ubtn b,.mbtn b{font-size:22px;font-weight:400}
.ubtn span{font-family:'Andika',var(--disp);font-size:22px;color:var(--c)}
.mbtn span{font-size:16px;color:#475569}
.mbtn i{font-style:normal;color:#F59E0B;font-size:18px;min-height:22px}
.ubtn[aria-pressed="true"]{border-color:var(--c);background:#FFF7E0}
.mbtn[aria-pressed="true"]{border-color:var(--yel);background:#FFF7E0}
.play{width:150px;height:150px;border-radius:50%;margin-top:6px;border:7px solid #fff;
  background:radial-gradient(circle at 35% 28%,#FFE680,#FFC21A 45%,#FF8A00);box-shadow:0 8px 0 #B45309,0 14px 22px rgba(0,0,0,.35);position:relative}
.play::after{content:'';position:absolute;left:58px;top:42px;border-left:46px solid #fff;border-top:30px solid transparent;border-bottom:30px solid transparent}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #B45309}
/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:radial-gradient(circle,rgba(255,200,0,.35),rgba(0,0,0,.55) 70%)}
.card{width:min(380px,92vw);background:linear-gradient(#CFF7A4,#9BE15D);border:6px solid #fff;border-radius:24px;text-align:center;padding:64px 20px 22px;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.card.lose{background:linear-gradient(#FFE0D1,#FFB38A)}
.ribbon{position:absolute;top:-26px;left:-14px;right:-14px;background:linear-gradient(#9BEA3F,#5DBB12);color:#fff;font-size:40px;padding:8px 0;border-radius:14px;border:5px solid #4E8E0E;-webkit-text-stroke:2px #2F5D05;paint-order:stroke fill}
.ribbon.red{background:linear-gradient(#FF7A59,#E0392B);border-color:#9F1D12;-webkit-text-stroke:2px #7F1D1D}
.done{font-size:30px;color:#fff;-webkit-text-stroke:3px #2F5D05;paint-order:stroke fill}
.stars{font-size:62px;letter-spacing:6px;color:rgba(0,0,0,.18);margin:6px 0}
.stars .on{color:#FFC21A;-webkit-text-stroke:3px #B45309;paint-order:stroke fill}
.coinbig{font-size:54px;color:#fff;-webkit-text-stroke:4px #1F2A44;paint-order:stroke fill;display:flex;align-items:center;justify-content:center;gap:10px}
.coinbig .c{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE680,#FACC15 50%,#F59E0B);border:4px solid #B45309}
.card .ar{font-size:20px;margin:6px 0 14px}
.gbtn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:16px;font-size:30px;color:#fff;background:linear-gradient(#9BEA3F,#5DBB12);border:4px solid #2F5D05;box-shadow:0 5px 0 #2F5D05;-webkit-text-stroke:2px #2F5D05;paint-order:stroke fill}
.gbtn.orange{background:linear-gradient(#FFD54A,#FF8A00);border-color:#9A4A00;box-shadow:0 5px 0 #9A4A00;-webkit-text-stroke:2px #9A4A00}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #2F5D05}
.lbtn{margin-top:12px;background:none;font-size:20px;color:#1F2A44;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;padding:12px 20px;border-radius:14px;font-size:18px;z-index:30;font-family:system-ui}
@media (prefers-reduced-motion: reduce){.play:active,.cbtn:active,.gbtn:active{transform:none}}
</style>

<body>
<svg id="scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" aria-label="Parking lot"></svg>
<div class="corner l"><button class="cbtn" data-act="menu" aria-label="Menu">◀</button></div>
<div class="corner r"><button class="cbtn blue" data-act="say" aria-label="Listen">🔊</button><button class="cbtn" data-act="hint" aria-label="Hint">💡</button></div>
<div id="menu" hidden></div>
<script>var IMG = {};</script>
<script>'use strict';
// ================= CONTENT (booklet) =================
const UNITS = [
  { id: 1, c: '#E4572E', L: { a: [[1, 'apple'], [3, 'avocado'], [2, 'astronaut']], c: [[4, 'cat'], [6, 'cactus'], [5, 'coffee']], t: [[10, 'table'], [9, 'TV'], [42, 'tin']], n: [[8, 'nose'], [7, 'nectarine']] }, words: ['cat', 'can', 'tan', 'nan', 'tat', 'an'] },
  { id: 2, c: '#138A80', L: { p: [[15, 'panda'], [13, 'pencil'], [14, 'popcorn']], i: [[18, 'igloo'], [17, 'Israel']], r: [[23, 'robot'], [24, 'radio'], [22, 'run']], s: [[19, 'sun'], [20, 'sandwich'], [21, 'sandals']] }, words: ['rat', 'pin', 'sat', 'tin', 'cap', 'sip'] },
  { id: 3, c: '#7B4FB3', L: { d: [[29, 'dog'], [31, 'dolphin'], [30, 'domino']], g: [[32, 'goat'], [33, 'guitar'], [34, 'gorilla']], h: [[37, 'house'], [35, 'hippo'], [36, 'hamburger']], o: [[38, 'orange'], [39, 'overalls']] }, words: ['dog', 'sad', 'pot', 'cop', 'hot', 'top'] },
  { id: 4, c: '#D97706', L: { b: [[51, 'banana'], [52, 'bed'], [53, 'balloons']], e: [[49, 'elephant'], [50, 'Eskimo']], f: [[55, 'fish'], [56, 'frog'], [54, 'flamingo']], m: [[57, 'mouse'], [58, 'mango'], [59, 'milkshake']] }, words: ['bed', 'pen', 'net', 'fan', 'hen', 'ten'] },
  { id: 5, c: '#2F6FDB', L: { j: [[84, 'jam'], [83, 'jeans'], [85, 'jester']], k: [[87, 'kite'], [88, 'kangaroo'], [86, 'ketchup']], l: [[94, 'lemon'], [93, 'London'], [92, 'love']], y: [[91, 'yoyo'], [89, 'yacht'], [90, 'yard']] }, words: ['jam', 'jet', 'log', 'jar', 'yak', 'jog'] },
];
const MODES = [
  ['pic', 'First letter', 'الحرف الأول'],
  ['letter', 'Hear the letter', 'استمع للحرف'],
  ['word', 'Hear the word', 'استمع للكلمة'],
];
const LEVELS = [{ n: 4, big: 0 }, { n: 6, big: 1 }, { n: 8, big: 2 }, { n: 10, big: 2 }];
const BUS_COLORS = [['#EF3B3B', '#B91C1C'], ['#2563EB', '#1E40AF'], ['#FACC15', '#CA8A04'], ['#22C55E', '#15803D'], ['#A855F7', '#7E22CE'], ['#F97316', '#C2410C'], ['#EC4899', '#BE185D'], ['#06B6D4', '#0E7490']];
const PAX_COLORS = ['#2563EB', '#FACC15', '#EF3B3B', '#22C55E', '#A855F7', '#F97316', '#EC4899', '#06B6D4'];

// ================= GEOMETRY =================
const N = 6, CS = 68, ROT = -30 * Math.PI / 180, CX = 650, CY = 600;
const ROAD_Y = 222, QUEUE_Y = 96, FRONT_X = 1000;
const BAYS = [0, 1, 2, 3, 4, 5, 6, 7].map(i => ({ x: 430 + i * 66, y: 152 }));
const OPEN0 = 4, UNLOCK_COST = 100;
const rot = (x, y) => [x * Math.cos(ROT) - y * Math.sin(ROT), x * Math.sin(ROT) + y * Math.cos(ROT)];
const toWorld = (lx, ly) => { const [x, y] = rot(lx, ly); return [CX + x, CY + y]; };
const DIRV = { 'h1': [1, 0], 'h-1': [-1, 0], 'v1': [0, 1], 'v-1': [0, -1] };

// ================= UTIL =================
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function tween(dur, f, e = ease) { return new Promise(res => { const t0 = performance.now(); const step = t => { const k = Math.min(1, (t - t0) / dur); f(e(k)); k < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); }); }
const LS = { get(k, d) { try { const v = localStorage.getItem('lbus:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('lbus:' + k, JSON.stringify(v)); } catch (e) {} } };
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

// ================= SOUND =================
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Google US|Aaron|Nicky/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t, rate = 0.8) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; if (VOICE) u.voice = VOICE; u.rate = rate; speechSynthesis.speak(u); } catch (e) {} }
let AC = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(freqs, type = 'sine', vol = .15, gap = .1, len = .16) {
  const a = ac(); if (!a) return;
  freqs.forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; const t = a.currentTime + i * gap;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + len + .02); });
}
const sfx = {
  horn: () => tone([330, 330], 'square', .05, .14, .12),
  coin: () => tone([988, 1319], 'triangle', .1, .07, .12),
  engine: () => { const a = ac(); if (!a) return; const o = a.createOscillator(), g = a.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(90, a.currentTime); o.frequency.exponentialRampToValueAtTime(260, a.currentTime + .35);
    g.gain.setValueAtTime(.05, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .4); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .42); },
  wrong: () => tone([294, 220], 'triangle', .14, .13, .2),
  win: () => tone([523, 659, 784, 1046, 1319], 'triangle', .13, .11, .22),
};

// ================= STATE =================
const S = { unit: LS.get('unit', 1), mode: LS.get('mode', 'pic'), level: 1, coins: LS.get('coins', 0), cars: [], queue: [], total: 0, bays: [], open: OPEN0, mistakes: 0, hints: 0, over: false, boarding: false };
const U = () => UNITS.find(u => u.id === S.unit);

// ================= LEVEL =================
function cellsOf(v) { const o = []; for (let k = 0; k < v.len; k++) o.push(v.ori === 'h' ? [v.r, v.c + k] : [v.r + k, v.c]); return o; }
function grid(except) { const g = Array.from({ length: N }, () => Array(N).fill(null)); S.cars.forEach(v => { if (v.state === 'lot' && v !== except) cellsOf(v).forEach(([r, c]) => g[r][c] = v); }); return g; }
function pathOf(v) {
  const [dx, dy] = DIRV[v.ori + v.dir], out = [];
  let r, c;
  if (v.dir > 0) { [r, c] = v.ori === 'h' ? [v.r, v.c + v.len] : [v.r + v.len, v.c]; } else { [r, c] = v.ori === 'h' ? [v.r, v.c - 1] : [v.r - 1, v.c]; }
  while (r >= 0 && r < N && c >= 0 && c < N) { out.push([r, c]); r += dy; c += dx; }
  return out;
}
function generate() {
  const cfg = LEVELS[Math.min(S.level, LEVELS.length) - 1];
  const labels = S.mode === 'word' ? shuffle(U().words).slice(0, 4) : Object.keys(U().L);
  for (let att = 0; att < 5000; att++) {
    const cars = []; let ok = true; const cols = shuffle(BUS_COLORS);
    for (let i = 0; i < cfg.n && ok; i++) {
      let placed = false;
      for (let t = 0; t < 90 && !placed; t++) {
        const len = i < cfg.big ? 3 : 2, ori = Math.random() < .5 ? 'h' : 'v';
        const v = { id: i, label: labels[i % labels.length], len, ori, r: rnd(ori === 'v' ? N - len + 1 : N), c: rnd(ori === 'h' ? N - len + 1 : N), dir: Math.random() < .5 ? 1 : -1, col: cols[i % cols.length], state: 'lot', cap: len === 3 ? 4 : 3, seats: 0 };
        S.cars = cars; const g = grid();
        if (cellsOf(v).every(([r, c]) => !g[r][c])) { cars.push(v); placed = true; }
      }
      if (!placed) ok = false;
    }
    if (!ok) continue;
    S.cars = cars;
    const order = []; const saved = cars.map(v => v.state);
    while (true) { const free = cars.filter(v => v.state === 'lot' && isFree(v)); if (!free.length) break; const v = pick(free); v.state = 'x'; order.push(v); }
    const solved = order.length === cars.length;
    cars.forEach((v, i) => v.state = saved[i]);
    if (!solved) continue;
    if (cfg.n >= 6 && cars.filter(v => !isFree(v)).length < Math.floor(cfg.n / 3)) continue;
    // passengers follow a valid exit order; each group gets its own colour (colour never gives the answer)
    S.queue = []; let gi = 0;
    order.forEach(v => { const col = PAX_COLORS[gi++ % PAX_COLORS.length]; const item = makeItem(v.label); for (let k = 0; k < v.cap; k++) S.queue.push({ label: v.label, col, item }); });
    S.total = S.queue.length; S.bays = Array(8).fill(null); S.open = OPEN0; S.mistakes = 0; S.hints = 0; S.over = false; S.boarding = false; S.earned = 0;
    return;
  }
}
function isFree(v) { const g = grid(v); return pathOf(v).every(([r, c]) => !g[r][c]); }
function makeItem(label) { if (S.mode === 'pic') { const p = pick(U().L[label]); return { img: p[0], word: p[1] }; } return {}; }
function speakFront() {
  const f = S.queue[0]; if (!f) return;
  if (S.mode === 'pic') say(f.item.word); else if (S.mode === 'letter') say('letter ' + f.label.toUpperCase() + '.', .75); else say(f.label, .7);
}

// ================= SCENE =================
let svg, carsL, fxL, queueL, bayL, boardL, hudL;
function buildScene() {
  svg = $('#scene'); svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  defs.innerHTML = `
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".3"/></filter>
    <pattern id="pave" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#5D6577"/><path d="M0 11h22M11 0v22" stroke="#545C6D" stroke-width="2"/></pattern>
    <pattern id="asph" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#A3A9B4"/><circle cx="12" cy="20" r="1.4" fill="#979DA8"/><circle cx="52" cy="60" r="1.2" fill="#979DA8"/><circle cx="66" cy="14" r="1" fill="#B0B5BF"/><circle cx="30" cy="70" r="1" fill="#B0B5BF"/></pattern>
    <radialGradient id="tree" cx=".4" cy=".35"><stop offset="0" stop-color="#9BE15D"/><stop offset=".7" stop-color="#5DAA2A"/><stop offset="1" stop-color="#3F7F1C"/></radialGradient>
    <linearGradient id="win" x1="0" x2="1"><stop offset="0" stop-color="#BFE9FF"/><stop offset="1" stop-color="#6CC3EE"/></linearGradient>`;
  // lot
  el('rect', { x: 0, y: 248, width: 1200, height: 652, fill: 'url(#asph)' }, svg);
  // buildings
  const bcols = ['#E2803C', '#F2C14E', '#3BA7C9', '#E36B4E', '#7CC36B', '#F2C14E', '#3BA7C9'];
  for (let i = 0; i < 7; i++) {
    const x = i * 180 - 20, b = el('g', {}, svg);
    el('rect', { x, y: -10, width: 172, height: 70, fill: bcols[i] }, b);
    el('rect', { x, y: 50, width: 172, height: 8, fill: 'rgba(0,0,0,.18)' }, b);
    for (let k = 0; k < 4; k++) el('rect', { x: x + 12 + k * 40, y: 14, width: 28, height: 18, rx: 3, fill: '#CFF1FF', stroke: '#23485E', 'stroke-width': 2 }, b);
    el('rect', { x: x + 50, y: 38, width: 72, height: 12, rx: 3, fill: '#2B3A4A', opacity: .5 }, b);
  }
  // sidewalk + platform
  el('rect', { x: 0, y: 58, width: 1200, height: 132, fill: 'url(#pave)' }, svg);
  el('path', { d: `M330 192 L392 112 Q400 104 412 104 L960 104 Q972 104 980 112 L1040 192 Z`, fill: '#4A5162' }, svg);
  for (let i = 0; i < 12; i++) { if (i > 2 && i < 10) continue; const x = 40 + i * 100; drawBush(x, 150); }
  // road
  el('rect', { x: 0, y: 190, width: 1200, height: 60, fill: '#3E4554' }, svg);
  el('rect', { x: 0, y: 190, width: 1200, height: 4, fill: '#5D6577' }, svg);
  el('line', { x1: 0, y1: ROAD_Y, x2: 1200, y2: ROAD_Y, stroke: '#F1F5F9', 'stroke-width': 3, 'stroke-dasharray': '22 18' }, svg);
  [180, 360, 1080].forEach(x => { for (let k = 0; k < 7; k++) el('rect', { x: x, y: 194 + k * 8, width: 34, height: 4, fill: '#E5E7EB' }, svg); });
  // station building (queue enters here)
  const st = el('g', { filter: 'url(#sh2)' }, svg);
  el('rect', { x: 1010, y: 66, width: 54, height: 62, rx: 10, fill: '#E5E7EB', stroke: '#9CA3AF', 'stroke-width': 2 }, st);
  el('rect', { x: 1016, y: 72, width: 8, height: 50, rx: 3, fill: '#2563EB' }, st);
  el('rect', { x: 1032, y: 74, width: 24, height: 40, rx: 4, fill: '#94A3B8' }, st);
  // planters
  [[120, 760, 1.15], [1090, 440, 1.2], [1080, 800, 1]].forEach(([x, y, s]) => drawPlanter(x, y, s));
  bayL = el('g', {}, svg);
  boardL = el('g', {}, svg);
  queueL = el('g', {}, svg);
  fxL = el('g', {}, svg);
  carsL = el('g', {}, svg);
  hudL = el('g', {}, svg);
}

    bus: 'Tap the bus with the right word. Buses only move the way the arrow points.', kicks: 'Look at the big screen, then shoot at the right word.', race: 'Steer with ◀ ▶ through the gate with the right word.' }
}[KUI] || null;
const KTX = KT || { img: 'Picture → word', mean: 'Meaning → word', listen: 'Listen → word', back: '← Kalima', few: '', bus: '', kicks: '', race: '' };
const KLANG = { en: 'en-US', ar: 'ar-SA', he: 'he-IL', fr: 'fr-FR', es: 'es-ES', de: 'de-DE', ru: 'ru-RU', tr: 'tr-TR' };
const KHAS_IMG = KW.filter(w => w.img).length >= 2;
let KMODE = (() => { try { return localStorage.getItem('kl:gmode'); } catch (e) { return null; } })();
if (!['img', 'mean', 'listen'].includes(KMODE) || (KMODE === 'img' && !KHAS_IMG)) KMODE = KHAS_IMG ? 'img' : 'mean';

// ---------- voice in the right language ----------
let kAudio = null;
function kVoice(code) { try { const vs = speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(code.slice(0, 2)));
  return vs.find(v => /(Enhanced|Premium|Natural|Neural|Online)/i.test(v.name)) || vs[0] || null; } catch (e) { return null; } }
function kTTS(text, lang) { try { speechSynthesis.cancel(); if (kAudio) { kAudio.pause(); kAudio = null; } if (!text) return;
  const code = KLANG[lang] || 'en-US', u = new SpeechSynthesisUtterance(text); u.lang = code; const v = kVoice(code); if (v) u.voice = v; u.rate = .85; speechSynthesis.speak(u); } catch (e) {} }
function kSayWord(w) { if (w.audio) { try { speechSynthesis.cancel(); if (kAudio) kAudio.pause(); kAudio = new Audio(w.audio); kAudio.play().catch(() => {}); return; } catch (e) {} } kTTS(w.term, KSET.termLang); }
// The games call say() with English phrases ("cat starts with ...", "The answer is CAT"); only the set's own words are spoken.
say = function (t) {
  t = String(t || '').trim(); if (!t) { try { speechSynthesis.cancel(); } catch (e) {} return; }
  const m = KW.find(w => w.meaning.trim() === t); if (m) return kTTS(m.meaning, KSET.meanLang);
  const low = t.toLowerCase();
  const w = KW.slice().sort((a, b) => b.term.length - a.term.length).find(x => { const k = x.term.trim().toLowerCase(); return low === k || low.endsWith(' ' + k) || low.endsWith(' ' + k + '.'); });
  if (w) return kSayWord(w);
};

// ---------- text fitting (words or whole sentences) ----------
const KFACE = (s, w = 700) => `${w} ${s}px Andika,"IBM Plex Sans Arabic","IBM Plex Sans Hebrew","Century Gothic",Arial,sans-serif`;
const kM = document.createElement('canvas').getContext('2d');
const kRTL = l => l === 'ar' || l === 'he';
function kWrapM(x, text, W) { const ws = String(text).trim().split(/\s+/), lines = []; let cur = '';
  for (const w of ws) { const t2 = cur ? cur + ' ' + w : w; if (!cur || x.measureText(t2).width <= W) cur = t2; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur); return lines; }
// biggest font size whose wrapped lines fit inside W x H
function kFit(text, W, H, maxFs, minFs, x = kM) {
  for (let fs = maxFs; fs >= minFs; fs -= 1) { x.font = KFACE(fs); const lines = kWrapM(x, text, W);
    if (lines.length * fs * 1.18 <= H && lines.every(l => x.measureText(l).width <= W)) return { fs, lines }; }
  x.font = KFACE(minFs); return { fs: minFs, lines: kWrapM(x, text, W) };
}
function kTextWidth(line, fs) { kM.font = KFACE(fs); return kM.measureText(line).width; }
// SVG multi-line text centred on (0, cy)
function kSvgText(g, lines, fs, cy, fill, lang) {
  const lh = fs * 1.18, top = cy - (lines.length * lh) / 2;
  lines.forEach((ln, i) => { const t = el('text', { x: 0, y: (top + lh * i + fs * .9).toFixed(1), 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 700, fill, 'font-family': 'Andika, "IBM Plex Sans Arabic", "IBM Plex Sans Hebrew", "Century Gothic", sans-serif' }, g);
    if (kRTL(lang)) t.setAttribute('direction', 'rtl'); t.textContent = ln; });
}
// meaning cards drawn as pictures, so every game shows them where it shows images
let KCARD = [360, 270];
function kCard(text, lang) {
  const [W, H] = KCARD, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
  try { x.direction = kRTL(lang) ? 'rtl' : 'ltr'; } catch (e) {}
  const pad = W * .07, f = kFit(text, W - pad * 2, H - pad * 1.6, Math.round(H * .34), 14, x), lh = f.fs * 1.18, top = (H - f.lines.length * lh) / 2;
  x.font = KFACE(f.fs); x.textAlign = 'center'; x.textBaseline = 'middle';
  f.lines.forEach((ln, i) => { const w = Math.min(W - pad, x.measureText(ln).width + 16), y = top + lh * i + lh / 2;
    x.fillStyle = '#FFE680'; x.fillRect((W - w) / 2, y + f.fs * .08, w, f.fs * .36); x.fillStyle = '#1F2A44'; x.fillText(ln, W / 2, y); });
  return c.toDataURL('image/png');
}
// bus badge: a pill that grows to two or three lines for long words and sentences
function kBadge(g, label, stroke) {
  const len = [...label].length;
  let f = len <= 10 ? { fs: len <= 1 ? 33 : 27, lines: [label] } : kFit(label, 150, 66, 22, 12);
  if (len <= 10 && kTextWidth(label, f.fs) > 150) f = kFit(label, 150, 66, 22, 12);
  const bw = Math.max(44, Math.max(...f.lines.map(l => kTextWidth(l, f.fs))) + 26), bh = Math.max(42, f.lines.length * f.fs * 1.18 + 12);
  el('rect', { x: -bw / 2, y: -bh / 2, width: bw, height: bh, rx: Math.min(21, bh / 2), fill: '#fff', stroke, 'stroke-width': 4 }, g);
  kSvgText(g, f.lines, f.fs, 0, '#1F2A44', KSET.termLang);
}
const kShuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function kBuild(n) {
  const pool = KMODE === 'img' ? KW.filter(w => w.img) : KW;
  const ws = kShuffle(pool).slice(0, Math.max(2, Math.min(n, pool.length)));
  const L = {};
  ws.forEach((w, i) => { const key = 'k' + i; IMG[key] = KMODE === 'img' ? w.img : kCard(w.meaning, KSET.meanLang); L[w.term.trim()] = [[key, KMODE === 'mean' ? w.meaning.trim() : '']]; });
  UNITS[0].L = L; UNITS[0].words = ws.map(w => w.term.trim());
  S.mode = KMODE === 'listen' ? 'word' : 'pic';
}
UNITS.length = 0;
UNITS.push({ id: 1, c: '#0E7C86', flag: ['#0E7C86', '#FFFFFF', '#0E7C86'], L: {}, words: [] });
S.unit = 1;
kBuild(4);

// ---------- shared menu pieces ----------
function kModes(btnClass) {
  return [KHAS_IMG ? 'img' : null, 'mean', 'listen'].filter(Boolean)
    .map(k => `<button class="${btnClass}" aria-pressed="${KMODE === k}" data-act="kmode" data-id="${k}"><b>${KTX[k]}</b></button>`).join('');
}
function kTitle() { return String(KSET.title || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const kBack = `<a class="kback" href="index.html#games">${KTX.back}</a>`;
const kFew = KW.length < 2 ? `<p class="ar how" style="color:#B91C1C">${KTX.few}</p>` : '';
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act="kmode"]'); if (!t) return;
  KMODE = t.getAttribute('data-id'); try { localStorage.setItem('kl:gmode', KMODE); } catch (er) {} kBuild(4); showMenu();
}, true);
const kStyle = document.createElement('style');
kStyle.textContent = `.kback{display:inline-block;margin-top:10px;color:#fff;background:rgba(0,0,0,.35);padding:8px 16px;border-radius:999px;text-decoration:none;font:600 15px system-ui,sans-serif}
.ktitle{font:800 22px "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);margin:2px 0 6px}`;
document.head.appendChild(kStyle);

;
const _kStartLevel = startLevel; startLevel = function () { kBuild(4); _kStartLevel(); };
showMenu = function () {
  $('#menu').innerHTML = `<div class="logo"><div class="l1">WORD BUS</div><div class="l2">PARKING OUT</div></div><div class="ktitle">${kTitle()}</div>
    <p class="ar how">${KTX.bus}</p>${kFew}<div class="modes">${kModes('mbtn')}</div>${KW.length >= 2 ? '<button class="play" data-act="play" aria-label="Play"></button>' : ''}${kBack}`;
  $('#menu').hidden = false;
};
showMenu();
</script>
</body>
</html>
