<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Kalima</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Layout: a classroom word-wall. Teacher = a working table of word cards; student = three big doors, then one card at a time.
   Signature detail: words are marked with a highlighter stroke, the way a teacher marks target vocabulary in a text. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#18222E; --muted:#5B6878; --line:#DCE3EA;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --mark:#FFD84D; --mark-soft:#FFF1B8;
  --good:#1E9E5A; --good-soft:#DDF5E7; --bad:#D6453D; --bad-soft:#FCE3E1;
  --shadow:0 1px 2px rgba(24,34,46,.06),0 4px 14px rgba(24,34,46,.06);
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161D; --surface:#18212B; --ink:#E8EEF4; --muted:#9AA8B8; --line:#2A3542;
  --accent:#3BB8C2; --accent-ink:#06262A; --mark:#E8B923; --mark-soft:#3B3313;
  --good:#3CCB7F; --good-soft:#123423; --bad:#FF6B61; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161D; --surface:#18212B; --ink:#E8EEF4; --muted:#9AA8B8; --line:#2A3542;
  --accent:#3BB8C2; --accent-ink:#06262A; --mark:#E8B923; --mark-soft:#3B3313;
  --good:#3CCB7F; --good-soft:#123423; --bad:#FF6B61; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1040px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;display:flex;align-items:center;gap:8px}
.brand .hl{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 90%,transparent 90%);padding:0 4px}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
select.small{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
input.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
textarea.in{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
/* sets list */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.setcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:start}
.setcard h3{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--mark-soft);border-radius:6px;padding:1px 8px;font-size:13px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){.ed{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--mark)}
.wtable{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:28px 64px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.wrow .n{color:var(--muted);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.thumb{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;padding:0;color:var(--muted);font-size:22px}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.wrow input{border:1px solid transparent;background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.wrow input:focus{border-color:var(--accent)}
.wrow .acts{display:flex;gap:4px}
.ico{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;padding:0}
.ico.on{background:var(--mark-soft);border-color:var(--mark)}
@media (max-width:560px){.wrow{grid-template-columns:56px minmax(0,1fr) auto;grid-template-areas:'pic term acts' 'pic mean acts'}.wrow .n{display:none}.wrow .thumb{width:56px;height:56px;grid-area:pic}.wrow input[data-f=term]{grid-area:term}.wrow input[data-f=meaning]{grid-area:mean}.wrow .acts{grid-area:acts;flex-direction:column}}
.textpick{line-height:2.3;font-size:17px;background:var(--bg);border-radius:10px;padding:12px}
.tok{border:0;background:none;padding:1px 3px;border-radius:4px}
.tok.sel{background:linear-gradient(transparent 50%,var(--mark) 50%)}
.tok:hover{background:var(--mark-soft)}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check .why{margin-inline-start:auto;font-size:11px;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:20;display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.picgrid button{border:2px solid var(--line);background:#fff;border-radius:12px;aspect-ratio:1;padding:6px;max-width:100%}
.picgrid button:hover{border-color:var(--accent)}
.picgrid img{width:100%;height:100%;object-fit:contain}
.note{background:var(--mark-soft);border-radius:10px;padding:10px 12px;font-size:13px}
/* student */
.hero{text-align:center;padding-block:24px 8px}
.hero h1{font-size:clamp(30px,6vw,46px)}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
@media (max-width:640px){.doors{grid-template-columns:minmax(0,1fr)}}
.door{border:0;border-radius:22px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;box-shadow:var(--shadow);text-align:center}
.door .big{font-size:52px;line-height:1}
.door b{font-family:var(--f-display);font-size:26px}
.door span{opacity:.9;font-size:14px}
.d1{background:#0E7C86}.d2{background:#3E5BA9}.d3{background:#E0712B}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;text-align:start}
.excard .e{font-size:30px}
.excard b{font-size:16px}
.stage{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:150px;justify-content:center}
.prompt img{max-height:170px;max-width:100%;object-fit:contain;background:#fff;border-radius:12px}
.prompt .w{font-family:var(--f-display);font-size:clamp(30px,7vw,44px);font-weight:800}
.prompt .w.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 6px}
.speak{border:0;background:var(--accent);color:var(--accent-ink);width:56px;height:56px;border-radius:50%;font-size:24px}
.speak.big{width:88px;height:88px;font-size:38px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 10px;font-size:20px;font-weight:600;min-height:68px}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad);animation:shake .35s}
.opt.pic{padding:6px;aspect-ratio:1/0.8}
.opt.pic img{width:100%;height:100%;object-fit:contain}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.opt.no{animation:none}.flip-in{transition:none!important}}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr}
.slot{width:44px;height:52px;border-bottom:3px solid var(--ink);font-size:28px;font-weight:700;display:grid;place-items:center}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tile{width:50px;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--mark-soft);font-size:26px;font-weight:700}
.tile[disabled]{opacity:.25}
.fb{text-align:center;font-weight:700;min-height:24px}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.flash{perspective:1000px;cursor:pointer;border:0;background:none;padding:0}
.flash .face{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.flash .face.back{background:var(--mark-soft)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-size:18px;font-weight:600;min-height:58px}
.mi.sel{border-color:var(--accent);background:var(--mark-soft)}
.mi.done{visibility:hidden}
.mi.no{border-color:var(--bad);animation:shake .35s}
.score{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30;font-weight:600;max-width:90vw;text-align:center}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res th,table.res td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.res td.num{font-variant-numeric:tabular-nums;font-weight:700}
.tw{overflow-x:auto}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.gamecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.gamecard .e{font-size:40px}
</style>

  <header class="top" id="top"></header>

</div>

let AC = null;
function tone(ok) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  (ok ? [660, 880] : [300, 220]).forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.type = ok ? 'sine' : 'triangle';
    const t0 = AC.currentTime + i * .12; g.gain.setValueAtTime(.16, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .2); o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + .22); }); } catch (e) {} }
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function bestVoice(code) {
  const pre = code.slice(0, 2), vs = voices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(pre));
  return vs.find(v => /(Enhanced|Premium|Natural|Neural|Online)/i.test(v.name)) || vs.find(v => v.lang.replace('_', '-') === code) || vs[0] || null;
}
let curAudio = null;
function speak(w, lang) {
  try { speechSynthesis.cancel(); } catch (e) {}
  if (curAudio) { curAudio.pause(); curAudio = null; }
  if (w && w.audio) { curAudio = new Audio(w.audio); curAudio.play().catch(() => {}); return; }
  const text = typeof w === 'string' ? w : w.term; if (!text || !('speechSynthesis' in window)) return;
  const code = (LANGS[lang] || LANGS.en)[1], u = new SpeechSynthesisUtterance(text); u.lang = code; const v = bestVoice(code); if (v) u.voice = v; u.rate = .85;
  speechSynthesis.speak(u);
}

function fileToDataURL(f, maxSide) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => {
    if (!maxSide) return res(fr.result);
    const im = new Image(); im.onload = () => { const k = Math.min(1, maxSide / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      let u = c.toDataURL('image/webp', .8); if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/jpeg', .8); res(u); }; im.onerror = rej; im.src = fr.result; };
    fr.readAsDataURL(f); });
}
const REC = { on: false, mr: null, chunks: [] };
async function startRec() {
  try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); REC.mr = new MediaRecorder(st); REC.chunks = [];
    REC.mr.ondataavailable = e => REC.chunks.push(e.data);
    REC.mr.onstop = async () => { st.getTracks().forEach(x => x.stop()); const b = new Blob(REC.chunks, { type: REC.mr.mimeType || 'audio/webm' });
      const u = await fileToDataURL(b); setWord(M.wid, { audio: u }); REC.on = false; render(); renderModal(); };
    REC.mr.start(); REC.on = true; M.err = ''; renderModal();
  } catch (e) { M.err = t('micFail'); REC.on = false; renderModal(); }
}
function stopRec() { if (REC.on && REC.mr) { try { REC.mr.stop(); } catch (e) {} } }

const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, c => c.charCodeAt(0)); };
async function pack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) { const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return 'z' + b64u(new Uint8Array(buf)); }
  return 'j' + b64u(raw);
}
async function unpack(str) {
  const kind = str[0], bytes = unb64u(str.slice(1));
  const raw = kind === 'z' ? new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()) : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
async function shareSet() {
  const s = curSet(); const { text, ...rest } = s; const code = await pack(rest);
  const url = location.href.split('#')[0] + '#s=' + code;
  $('#modal').innerHTML = `<div class="modal" data-a="mback"><div class="mbox"><div class="row"><h2 style="font-size:22px">${t('linkTitle')}</h2><div class="sp"></div><button class="btn sm" data-a="mclose">${t('close')}</button></div>

    <div class="row"><button class="btn pri" data-a="copyLink">${t('copy')}</button></div>${url.length > 4000 ? `<p class="note">${t('linkLong')}</p>` : ''}</div></div>`;
  M.kind = 'link';
}

});
document.addEventListener('input', e => {
  if (e.target.id === 'libQ') { S.lib.q = e.target.value; const L = S.lib, q = normS(L.q.trim()); const list = libAll().filter(x => (L.subj === 'all' || x.subject === L.subj) && (!L.grade || String(x.grade) === L.grade) && (!q || normS([x.title, x.topic, x.author, ...x.words.map(w => w.term + ' ' + w.meaning)].join(' ')).includes(q))); $('#libRes').innerHTML = libCards(list); return; }
  if (e.target.id === 'tName') { store.set('teacher', e.target.value.trim()); return; }
  const el = e.target, a = el.dataset && el.dataset.a; const s = curSet(); if (!a || !s) return;
  if (a === 'wField') { const w = s.words.find(x => x.id === el.dataset.id); if (w) { w[el.dataset.f] = el.value; s.updated = Date.now(); saveSets(); } }
  if (a === 'setField' && el.id === 'sTitle') { s.title = el.value; saveSets(); }
  if (a === 'setField' && el.id === 'sTopic') { s.topic = el.value; saveSets(); }
  if (a === 'setField' && el.id === 'tCount') { s.test.count = Math.max(3, Math.min(50, +el.value || 10)); saveSets(); }
});
document.addEventListener('change', async e => {
  const el = e.target, a = el.dataset && el.dataset.a; const s = curSet();
  if (el.id === 'uiLang') { S.ui = el.value; store.set('ui', S.ui); render(); renderModal(); return; }
  if (el.id === 'libGrade') { S.lib.grade = el.value; render(); return; }
  if (el.id === 'upImg' && el.files[0]) { try { const u = await fileToDataURL(el.files[0], 360); setWord(M.wid, { img: u }); closeModal(); render(); } catch (er) { toast('⚠️'); } return; }
  if (el.id === 'upAud' && el.files[0]) { if (el.files[0].size > 1.5e6) { M.err = 'Max 1.5 MB'; renderModal(); return; } const u = await fileToDataURL(el.files[0]); setWord(M.wid, { audio: u }); render(); renderModal(); return; }
  if (!s || !a) return;
  if (a === 'setField' && el.id === 'sTermLang') { s.termLang = el.value; saveSets(); render(); }
  if (a === 'setField' && el.id === 'sMeanLang') { s.meanLang = el.value; saveSets(); render(); }
  if (a === 'setField' && el.id === 'sSubject') { s.subject = el.value; saveSets(); }
  if (a === 'setField' && el.id === 'sGrade') { s.grade = el.value; saveSets(); }
  const tog = (arr, val, on) => on ? (arr.includes(val) ? arr : arr.concat(val)) : arr.filter(x => x !== val);
  if (a === 'exT') { s.ex = EXT.filter(k => tog(s.ex, el.dataset.v, el.checked).includes(k)); saveSets(); }
  if (a === 'testT') { s.test.types = TESTT.filter(k => tog(s.test.types, el.dataset.v, el.checked).includes(k)); saveSets(); }
  if (a === 'gameT') { s.games = tog(s.games, el.dataset.v, el.checked); saveSets(); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.a === 'nameForm') { const n = $('#stName').value.trim(); if (!n) { $('#stName').focus(); return; } S.st.name = n; store.set('name', n); S.st.view = 'home'; render(); }
  if (f.dataset.a === 'typeForm') { const R = S.st.run, q = R.qs[R.i], v = $('#typeIn').value; if (!v.trim()) return; const ok = norm(v) === norm(q.w.term); answer(ok); if (ok) speak(q.w, S.st.set.termLang); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && M.kind) closeModal();
  if (e.key === 'Enter' && e.target.id === 'nMean') { e.preventDefault(); document.querySelector('[data-a="addOne"]').click(); }
  if (e.key === 'Enter' && e.target.id === 'nTerm') { e.preventDefault(); $('#nMean').focus(); }
});

// ================= start =================
(async function start() {
  const h = location.hash;
  if (h === '#games') {
    let kp = null; for (const st of [sessionStorage, localStorage]) { try { const x = st.getItem('kl:play'); if (x) { kp = JSON.parse(x); break; } } catch (e) {} }
    if (kp && kp.set) { if (kp.shared) S.shared = kp.set; else S.cur = kp.set.id; S.role = 'student'; S.st.name = kp.name || ''; enterStudent(kp.set); S.st.view = S.st.name ? 'games' : 'name'; }
  }
  if (h.startsWith('#s=')) {
    try { const set = await unpack(h.slice(3)); S.shared = set; S.role = 'student'; enterStudent(set); } catch (e) { toast('⚠️ link'); }
  }
  render();
})();
</script>
